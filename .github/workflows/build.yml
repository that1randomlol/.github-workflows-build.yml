{"name":"Build APK","jobs":{"build":{"runs-on":"ubuntu-latest","permissions":{"contents":"write"},"steps":[{"uses":"actions/checkout@v4"},{"name":"Projektdateien erzeugen","run":"mkdir -p app/src/main/java/com/example/lyricswall app/src/main/res/xml\ncat > settings.gradle.kts <<'EOF_FILE'\npluginManagement {\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"LyricsWall\"\ninclude(\":app\")\nEOF_FILE\ncat > build.gradle.kts <<'EOF_FILE'\nplugins {\n    id(\"com.android.application\") version \"8.5.2\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"1.9.24\" apply false\n}\nEOF_FILE\ncat > gradle.properties <<'EOF_FILE'\nandroid.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\nEOF_FILE\ncat > app/build.gradle.kts <<'EOF_FILE'\nplugins {\n    id(\"com.android.application\")\n    id(\"org.jetbrains.kotlin.android\")\n}\nandroid {\n    namespace = \"com.example.lyricswall\"\n    compileSdk = 34\n    defaultConfig {\n        applicationId = \"com.example.lyricswall\"\n        minSdk = 26\n        targetSdk = 34\n        versionCode = 1\n        versionName = \"1.0\"\n    }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = \"17\" }\n}\nEOF_FILE\ncat > app/src/main/AndroidManifest.xml <<'EOF_FILE'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-feature android:name=\"android.software.live_wallpaper\" android:required=\"true\" />\n    <application android:label=\"Lyrics Wallpaper\">\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:theme=\"@android:style/Theme.NoDisplay\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n        <service\n            android:name=\".LyricsWallpaperService\"\n            android:exported=\"true\"\n            android:permission=\"android.permission.BIND_WALLPAPER\">\n            <intent-filter>\n                <action android:name=\"android.service.wallpaper.WallpaperService\" />\n            </intent-filter>\n            <meta-data\n                android:name=\"android.service.wallpaper\"\n                android:resource=\"@xml/wallpaper\" />\n        </service>\n        <service\n            android:name=\".MediaListener\"\n            android:exported=\"true\"\n            android:label=\"Lyrics Wallpaper\"\n            android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\">\n            <intent-filter>\n                <action android:name=\"android.service.notification.NotificationListenerService\" />\n            </intent-filter>\n        </service>\n    </application>\n</manifest>\nEOF_FILE\ncat > app/src/main/res/xml/wallpaper.xml <<'EOF_FILE'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<wallpaper xmlns:android=\"http://schemas.android.com/apk/res/android\" />\nEOF_FILE\ncat > app/src/main/java/com/example/lyricswall/MainActivity.kt <<'EOF_FILE'\npackage com.example.lyricswall\n\nimport android.app.Activity\nimport android.content.Intent\nimport android.os.Bundle\nimport android.provider.Settings\n\n// Oeffnet beim Antippen des App-Icons direkt die Benachrichtigungszugriff-Einstellungen.\nclass MainActivity : Activity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))\n        finish()\n    }\n}\nEOF_FILE\ncat > app/src/main/java/com/example/lyricswall/LyricsWallpaper.kt <<'EOF_FILE'\npackage com.example.lyricswall\n\nimport android.content.ComponentName\nimport android.graphics.Bitmap\nimport android.graphics.Color\nimport android.graphics.Typeface\nimport android.media.MediaMetadata\nimport android.media.session.MediaSessionManager\nimport android.media.session.PlaybackState\nimport android.os.Handler\nimport android.os.Looper\nimport android.os.SystemClock\nimport android.service.notification.NotificationListenerService\nimport android.service.wallpaper.WallpaperService\nimport android.text.Layout\nimport android.text.StaticLayout\nimport android.text.TextPaint\nimport org.json.JSONObject\nimport java.net.HttpURLConnection\nimport java.net.URL\nimport java.net.URLEncoder\nimport kotlin.concurrent.thread\n\n// Leerer Listener: nur noetig, damit wir die aktiven Media-Sessions lesen duerfen.\nclass MediaListener : NotificationListenerService()\n\nclass LyricsWallpaperService : WallpaperService() {\n\n    override fun onCreateEngine(): Engine = LyricsEngine()\n\n    inner class LyricsEngine : Engine() {\n        private val handler = Handler(Looper.getMainLooper())\n        private var visible = false\n\n        // Track-Status\n        private var trackKey = \"\"\n        private var hasTrack = false\n        @Volatile private var lines: List<Pair<Long, String>> = emptyList()\n        private var basePos = 0L\n        private var baseTime = 0L\n        private var playing = false\n        private var speed = 1f\n        private var lastPoll = 0L\n\n        // Look\n        private var bg = Color.parseColor(\"#3B2A66\")\n        private var inactive = Color.parseColor(\"#1F1638\")\n        private val textPaint = TextPaint(TextPaint.ANTI_ALIAS_FLAG).apply {\n            typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)\n        }\n        private var layouts: List<StaticLayout> = emptyList()\n        private var layoutW = 0\n        private var scroll = 0f\n\n        private val tick = object : Runnable {\n            override fun run() {\n                draw()\n                if (visible) handler.postDelayed(this, 16)\n            }\n        }\n\n        override fun onVisibilityChanged(v: Boolean) {\n            visible = v\n            handler.removeCallbacks(tick)\n            if (v) handler.post(tick)\n        }\n\n        override fun onDestroy() {\n            handler.removeCallbacks(tick)\n        }\n\n        private fun draw() {\n            val now = SystemClock.elapsedRealtime()\n            if (now - lastPoll > 300) {\n                poll()\n                lastPoll = now\n            }\n\n            val holder = surfaceHolder\n            val canvas = holder.lockCanvas() ?: return\n            try {\n                canvas.drawColor(bg)\n                val d = resources.displayMetrics.density\n\n                if (!hasTrack || lines.isEmpty()) {\n                    textPaint.textSize = 20 * d\n                    textPaint.color = inactive\n                    val msg = if (!hasTrack) \"Spotify spielt nichts\" else \"Keine Lyrics gefunden\"\n                    canvas.drawText(msg, 28 * d, canvas.height * 0.4f, textPaint)\n                    return\n                }\n\n                val padX = 28 * d\n                val gap = 22 * d\n                val textW = (canvas.width - 2 * padX).toInt()\n                if (layoutW != textW || layouts.size != lines.size) buildLayouts(textW, d)\n\n                val pos = basePos + if (playing) ((now - baseTime) * speed).toLong() else 0L\n                val cur = lines.indexOfLast { it.first <= pos }.coerceAtLeast(0)\n\n                // Oberkante jeder Zeile\n                val tops = FloatArray(layouts.size)\n                var y = 0f\n                for (i in layouts.indices) {\n                    tops[i] = y\n                    y += layouts[i].height + gap\n                }\n\n                // Weiches Scrollen: aktuelle Zeile bleibt oberhalb der Mitte\n                val target = tops[cur] - canvas.height * 0.28f\n                scroll += (target - scroll) * 0.12f\n\n                canvas.save()\n                canvas.translate(padX, -scroll)\n                for (i in layouts.indices) {\n                    val top = tops[i]\n                    val bottom = top + layouts[i].height\n                    if (bottom - scroll < 0 || top - scroll > canvas.height) continue\n                    textPaint.color = if (i == cur) Color.WHITE else inactive\n                    canvas.save()\n                    canvas.translate(0f, top)\n                    layouts[i].draw(canvas)\n                    canvas.restore()\n                }\n                canvas.restore()\n            } finally {\n                holder.unlockCanvasAndPost(canvas)\n            }\n        }\n\n        private fun buildLayouts(width: Int, d: Float) {\n            textPaint.textSize = 30 * d\n            layouts = lines.map { (_, text) ->\n                val t = text.ifBlank { \"\\u266A\" }\n                StaticLayout.Builder.obtain(t, 0, t.length, textPaint, width)\n                    .setAlignment(Layout.Alignment.ALIGN_NORMAL)\n                    .setLineSpacing(0f, 1.05f)\n                    .build()\n            }\n            layoutW = width\n        }\n\n        private fun poll() {\n            try {\n                val msm = getSystemService(MediaSessionManager::class.java)\n                val ctrl = msm.getActiveSessions(\n                    ComponentName(this@LyricsWallpaperService, MediaListener::class.java)\n                ).firstOrNull { it.packageName == \"com.spotify.music\" }\n                val meta = ctrl?.metadata\n                val state = ctrl?.playbackState\n                val title = meta?.getString(MediaMetadata.METADATA_KEY_TITLE)\n                if (ctrl == null || meta == null || state == null || title == null) {\n                    hasTrack = false\n                    return\n                }\n                hasTrack = true\n\n                val artist = meta.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: \"\"\n                val key = \"$artist|$title\"\n                if (key != trackKey) {\n                    trackKey = key\n                    lines = emptyList()\n                    layouts = emptyList()\n                    scroll = 0f\n                    updateColors(meta)\n                    loadLyrics(artist, title, meta.getLong(MediaMetadata.METADATA_KEY_DURATION) / 1000)\n                }\n\n                playing = state.state == PlaybackState.STATE_PLAYING\n                speed = state.playbackSpeed\n                basePos = state.position\n                baseTime = state.lastPositionUpdateTime\n                if (!playing) baseTime = SystemClock.elapsedRealtime()\n            } catch (e: SecurityException) {\n                hasTrack = false // Notification-Zugriff noch nicht erlaubt\n            }\n        }\n\n        // Hintergrundfarbe aus dem Albumcover, wie bei Spotify\n        private fun updateColors(meta: MediaMetadata) {\n            val bmp: Bitmap = meta.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)\n                ?: meta.getBitmap(MediaMetadata.METADATA_KEY_ART)\n                ?: meta.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)\n                ?: return\n            val px = Bitmap.createScaledBitmap(bmp, 1, 1, true).getPixel(0, 0)\n            val hsv = FloatArray(3)\n            Color.colorToHSV(px, hsv)\n            hsv[1] = (hsv[1] * 1.1f).coerceIn(0.35f, 0.8f)\n            hsv[2] = 0.58f\n            bg = Color.HSVToColor(hsv)\n            hsv[2] = 0.30f\n            inactive = Color.HSVToColor(hsv)\n        }\n\n        private fun loadLyrics(artist: String, title: String, durSec: Long) {\n            val myKey = trackKey\n            thread {\n                try {\n                    val url = \"https://lrclib.net/api/get\" +\n                        \"?artist_name=${URLEncoder.encode(artist, \"UTF-8\")}\" +\n                        \"&track_name=${URLEncoder.encode(title, \"UTF-8\")}\" +\n                        \"&duration=$durSec\"\n                    val conn = URL(url).openConnection() as HttpURLConnection\n                    conn.setRequestProperty(\"User-Agent\", \"LyricsWallpaper/0.2\")\n                    val body = conn.inputStream.bufferedReader().readText()\n                    val parsed = parseLrc(JSONObject(body).optString(\"syncedLyrics\", \"\"))\n                    if (myKey == trackKey) lines = parsed\n                } catch (e: Exception) {\n                    // 404 = kein Treffer, Lyrics bleiben leer\n                }\n            }\n        }\n\n        // Format: \"[01:23.45] Textzeile\"\n        private fun parseLrc(lrc: String): List<Pair<Long, String>> {\n            val re = Regex(\"\"\"\\[(\\d+):(\\d+)(?:\\.(\\d+))?]\\s*(.*)\"\"\")\n            return lrc.lines().mapNotNull { line ->\n                val m = re.matchEntire(line.trim()) ?: return@mapNotNull null\n                val (min, sec, frac, text) = m.destructured\n                val ms = min.toLong() * 60_000 + sec.toLong() * 1000 +\n                    (if (frac.isEmpty()) 0 else frac.padEnd(3, '0').take(3).toLong())\n                ms to text\n            }\n        }\n    }\n}\nEOF_FILE\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"APK bauen","run":"gradle assembleDebug"},{"name":"Release mit APK erstellen","uses":"softprops/action-gh-release@v2","with":{"tag_name":"v${{ github.run_number }}","files":"app/build/outputs/apk/debug/app-debug.apk"}}]}},"on":{"push":null,"workflow_dispatch":null}}
