                  private var layoutW = 0
                  private var scroll = 0f

                  private val tick = object : Runnable {
                      override fun run() {
                          draw()
                          if (visible) handler.postDelayed(this, 16)
                      }
                  }

                  override fun onVisibilityChanged(v: Boolean) {
                      visible = v
                      handler.removeCallbacks(tick)
                      if (v) handler.post(tick)
                  }

                  override fun onDestroy() {
                      handler.removeCallbacks(tick)
                  }

                  private fun draw() {
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastPoll > 300) {
                          poll()
                          lastPoll = now
                      }

                      val holder = surfaceHolder
                      val canvas = holder.lockCanvas() ?: return
                      try {
                          canvas.drawColor(bg)
                          val d = resources.displayMetrics.density

                          if (!hasTrack || lines.isEmpty()) {
                              textPaint.textSize = 20 * d
                              textPaint.color = inactive
                              val msg = if (!hasTrack) "Spotify spielt nichts" else "Keine Lyrics gefunden"
                              canvas.drawText(msg, 28 * d, canvas.height * 0.4f, textPaint)
                              return
                          }

                          val padX = 28 * d
                          val gap = 22 * d
                          val textW = (canvas.width - 2 * padX).toInt()
                          if (layoutW != textW || layouts.size != lines.size) buildLayouts(textW, d)

                          val pos = basePos + if (playing) ((now - baseTime) * speed).toLong() else 0L
                          val cur = lines.indexOfLast { it.first <= pos }.coerceAtLeast(0)

                          // Oberkante jeder Zeile
                          val tops = FloatArray(layouts.size)
                          var y = 0f
                          for (i in layouts.indices) {
                              tops[i] = y
                              y += layouts[i].height + gap
                          }

                          // Weiches Scrollen: aktuelle Zeile bleibt oberhalb der Mitte
                          val target = tops[cur] - canvas.height * 0.28f
                          scroll += (target - scroll) * 0.12f

                          canvas.save()
                          canvas.translate(padX, -scroll)
                          for (i in layouts.indices) {
                              val top = tops[i]
                              val bottom = top + layouts[i].height
                              if (bottom - scroll < 0 || top - scroll > canvas.height) continue
                              textPaint.color = if (i == cur) Color.WHITE else inactive
                              canvas.save()
                              canvas.translate(0f, top)
                              layouts[i].draw(canvas)
                              canvas.restore()
                          }
                          canvas.restore()
                      } finally {
                          holder.unlockCanvasAndPost(canvas)
                      }
                  }

                  private fun buildLayouts(width: Int, d: Float) {
                      textPaint.textSize = 30 * d
                      layouts = lines.map { (_, text) ->
                          val t = text.ifBlank { "\u266A" }
                          StaticLayout.Builder.obtain(t, 0, t.length, textPaint, width)
                              .setAlignment(Layout.Alignment.ALIGN_NORMAL)
                              .setLineSpacing(0f, 1.05f)
                              .build()
                      }
                      layoutW = width
                  }

                  private fun poll() {
                      try {
                          val msm = getSystemService(MediaSessionManager::class.java)
                          val ctrl = msm.getActiveSessions(
                              ComponentName(this@LyricsWallpaperService, MediaListener::class.java)
                          ).firstOrNull { it.packageName == "com.spotify.music" }
                          val meta = ctrl?.metadata
                          val state = ctrl?.playbackState
                          val title = meta?.getString(MediaMetadata.METADATA_KEY_TITLE)
                          if (ctrl == null || meta == null || state == null || title == null) {
                              hasTrack = false
                              return
                          }
                          hasTrack = true

                          val artist = meta.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                          val key = "$artist|$title"
                          if (key != trackKey) {
                              trackKey = key
                              lines = emptyList()
                              layouts = emptyList()
                              scroll = 0f
                              updateColors(meta)
                              loadLyrics(artist, title, meta.getLong(MediaMetadata.METADATA_KEY_DURATION) / 1000)
                          }

                          playing = state.state == PlaybackState.STATE_PLAYING
                          speed = state.playbackSpeed
                          basePos = state.position
                          baseTime = state.lastPositionUpdateTime
                          if (!playing) baseTime = SystemClock.elapsedRealtime()
                      } catch (e: SecurityException) {
                          hasTrack = false // Notification-Zugriff noch nicht erlaubt
                      }
                  }

                  // Hintergrundfarbe aus dem Albumcover, wie bei Spotify
                  private fun updateColors(meta: MediaMetadata) {
                      val bmp: Bitmap = meta.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                          ?: meta.getBitmap(MediaMetadata.METADATA_KEY_ART)
                          ?: meta.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)
                          ?: return
                      val px = Bitmap.createScaledBitmap(bmp, 1, 1, true).getPixel(0, 0)
                      val hsv = FloatArray(3)
                      Color.colorToHSV(px, hsv)
                      hsv[1] = (hsv[1] * 1.1f).coerceIn(0.35f, 0.8f)
                      hsv[2] = 0.58f
                      bg = Color.HSVToColor(hsv)
                      hsv[2] = 0.30f
                      inactive = Color.HSVToColor(hsv)
                  }

                  private fun loadLyrics(artist: String, title: String, durSec: Long) {
                      val myKey = trackKey
                      thread {
                          try {
                              val url = "https://lrclib.net/api/get" +
                                  "?artist_name=${URLEncoder.encode(artist, "UTF-8")}" +
                                  "&track_name=${URLEncoder.encode(title, "UTF-8")}" +
                                  "&duration=$durSec"
                              val conn = URL(url).openConnection() as HttpURLConnection
                              conn.setRequestProperty("User-Agent", "LyricsWallpaper/0.2")
                              val body = conn.inputStream.bufferedReader().readText()
                              val parsed = parseLrc(JSONObject(body).optString("syncedLyrics", ""))
                              if (myKey == trackKey) lines = parsed
                          } catch (e: Exception) {
                              // 404 = kein Treffer, Lyrics bleiben leer
                          }
                      }
                  }

                  // Format: "[01:23.45] Textzeile"
                  private fun parseLrc(lrc: String): List<Pair<Long, String>> {
                      val re = Regex("""\[(\d+):(\d+)(?:\.(\d+))?]\s*(.*)""")
                      return lrc.lines().mapNotNull { line ->
                          val m = re.matchEntire(line.trim()) ?: return@mapNotNull null
                          val (min, sec, frac, text) = m.destructured
                          val ms = min.toLong() * 60_000 + sec.toLong() * 1000 +
                              (if (frac.isEmpty()) 0 else frac.padEnd(3, '0').take(3).toLong())
                          ms to text
                      }
                  }
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        run: gradle assembleDebug
      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
